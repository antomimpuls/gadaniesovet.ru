name: Conversia verified static Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: conversia-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        id: pages_artifact
        with:
          path: .
          name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Wait for the uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        run: |
          test -n "$EXPECTED_ARTIFACT_ID"
          for attempt in {1..12}; do
            visible=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$PAGES_ARTIFACT_NAME" --jq '[.artifacts[] | select(.expired == false and .size_in_bytes > 0) | .id | tostring] | join(",")') || visible=
            if [ "$visible" = "$EXPECTED_ARTIFACT_ID" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The artifact from this attempt is not visible"
          exit 1
      - name: Check current main before publishing
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish current artifact
        if: steps.current.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
